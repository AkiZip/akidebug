# MySQL connection settings
[mysql]
host = 127.0.0.1
port = 3306
user = root
password =
database = akidebug

# Admin panel password
[admin]
password = admin123

# Flask session secret key - change this to a random string in production
[flask]
secret_key = change-me-to-a-random-string

# Server listen address
[server]
host = 0.0.0.0
port = 5000

# Gotify push notification (optional - leave url/token empty to disable)
[gotify]
url = https://push.example.de/message
token = <apptoken>
priority = 5
# Path to your self-signed CA certificate (PEM) used to verify the push server.
# Leave empty to use the system trust store.
ca_file = gotify-ca.crt
