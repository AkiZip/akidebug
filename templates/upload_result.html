<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if success %}Submitted{% else %}Failed{% endif %} - Telemetry Upload</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f6f8;
            font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
            color: #333;
        }
        .card {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, .08);
            padding: 40px 48px;
            text-align: center;
            max-width: 420px;
        }
        .icon { font-size: 48px; margin-bottom: 8px; }
        h2 { margin: 8px 0 12px; font-size: 22px; }
        .ok h2 { color: #2e7d32; }
        .err h2 { color: #c62828; }
        p { color: #666; margin: 6px 0; }
        .rid {
            display: inline-block;
            background: #f0f0f0;
            border-radius: 4px;
            padding: 2px 10px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="card {% if success %}ok{% else %}err{% endif %}">
        {% if success %}
        <div class="icon">✅</div>
        <h2>Submitted</h2>
        <p>{{ message }}</p>
        <p>Reference ID: <span class="rid">#{{ record_id }}</span></p>
        {% else %}
        <div class="icon">⚠️</div>
        <h2>Submission Failed</h2>
        <p>{{ message }}</p>
        {% endif %}
    </div>
</body>
</html>
