<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if success %}Submitted{% else %}Failed{% endif %} - akidebug</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f6f8;
            font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
            color: #333;
        }
        .card {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, .08);
            padding: 40px 48px;
            text-align: center;
            max-width: 420px;
        }
        .icon { font-size: 48px; margin-bottom: 8px; }
        h2 { margin: 8px 0 12px; font-size: 22px; }
        .ok h2 { color: #2e7d32; }
        .err h2 { color: #c62828; }
        p { color: #666; margin: 6px 0; }
        .rid {
            display: inline-block;
            background: #f0f0f0;
            border-radius: 4px;
            padding: 2px 10px;
            font-family: monospace;
        }
        a { color: #2e7d32; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .lang-picker {
            position: fixed;
            top: 12px;
            right: 12px;
            padding: 4px 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: #fff;
            font-size: 14px;
        }
    </style>
</head>
<body data-title-key="{% if success %}title_submitted{% else %}title_failed{% endif %}">
    <select class="lang-picker" id="lang-picker" aria-label="Language"></select>
    <div class="card {% if success %}ok{% else %}err{% endif %}">
        {% if success %}
        <div class="icon">✅</div>
        <h2 data-i18n="heading_submitted">Submitted</h2>
        <p data-i18n="{{ message_key }}">{{ message_key }}</p>
        <p><span data-i18n="ref_id">Reference ID:</span> <span class="rid">#{{ record_id }}</span></p>
        <p><a href="https://matrix.to/#/#akizip:matrix.org" target="_blank" rel="noopener" data-i18n="join_room">Join the room to follow up on the outcome</a></p>
        {% else %}
        <div class="icon">⚠️</div>
        <h2 data-i18n="heading_failed">Submission Failed</h2>
        <p data-i18n="{{ message_key }}">{{ message_key }}</p>
        {% endif %}
    </div>

        // No auto-detection: default to English, restore the user's choice only.
        const LANGS = [
            ["en", "English"],
            ["fr", "Français"],
            ["id", "Bahasa Indonesia"],
            ["it", "Italiano"],
            ["pl", "Polski"],
            ["pt_br", "Português (BR)"],
            ["ru", "Русский"],
            ["es", "Español"],
            ["ta", "தமிழ்"],
            ["tr", "Türkçe"],
            ["zh_cn", "简体中文"],
            ["zh_hk", "繁體中文"]
        ];

        const picker = document.getElementById("lang-picker");
        picker.innerHTML = LANGS.map(
            ([code, name]) => `<option value="${code}">${name}</option>`
        ).join("");

        function translate(lang, key) {
            return (I18N[lang] && I18N[lang][key]) || I18N.en[key] || key;
        }

        function setLang(lang) {
            if (!Object.hasOwn(I18N, lang)) lang = "en";
            document.querySelectorAll("[data-i18n]").forEach(el => {
                el.textContent = translate(lang, el.dataset.i18n);
            });
            document.title = translate(lang, document.body.dataset.titleKey) + " - akidebug";
            document.documentElement.lang = lang;
            picker.value = lang;
            try { localStorage.setItem("lang", lang); } catch (e) { /* private mode */ }
        }

        picker.addEventListener("change", () => setLang(picker.value));

        let saved = "en";
        try { saved = localStorage.getItem("lang") || "en"; } catch (e) { /* private mode */ }
        setLang(saved);
    </script>
</body>
</html>
